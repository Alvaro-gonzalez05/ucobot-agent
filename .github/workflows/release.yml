name: Release

# Publica el instalador en la pestaña Releases del repo, que es de donde lo baja
# el cliente desde el dashboard (el botón "Descargar UcoBot Agent" apunta a
# /releases/latest).
#
# Para publicar una versión: subir el número en package.json, y después
#   git tag v1.0.1 && git push origin v1.0.1

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # pkg mete Node adentro del .exe: el cliente no instala nada previo.
      - run: npm run build

      # El .exe se instala solo, así que el ZIP es sólo una comodidad para quien
      # prefiera bajar un paquete con las instrucciones al lado. El archivo que
      # importa es el .exe suelto: doble click y listo.
      - name: Armar el paquete
        run: |
          mkdir package
          copy dist\UcoBotAgent.exe package\
          copy INSTALAR.txt package\
          Compress-Archive -Path package\* -DestinationPath UcoBotAgent-windows.zip

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UcoBotAgent.exe
            UcoBotAgent-windows.zip
          generate_release_notes: true
