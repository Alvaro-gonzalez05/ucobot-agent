name: Release

# Publica los instaladores en la pestaña Releases del repo, que es de donde los
# baja el cliente desde el dashboard: los botones Windows y Android del panel
# apuntan a /releases/latest/download/<archivo>, y los equipos ya instalados
# bajan de ahí mismo la versión que anuncia la web.
#
# Para publicar una versión: subir el número en package.json, y después
#   git tag v1.0.1 && git push origin v1.0.1

on:
  push:
    tags: ["v*"]
    # Los cambios en la app Android compilan siempre, aunque no haya tag: se
    # escribe sin un POSNET a mano, así que CI es la única red de seguridad.
    branches: [main]
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  build-windows:
    # El .exe sólo se arma para publicar una versión; compilarlo en cada push
    # sería gastar cinco minutos de CI en algo que ya se probó a mano.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Node 22: Electron 44 (la app de escritorio) no se instala con Node 20, y el
      # .exe suelto se empaqueta igual para node22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # pkg mete Node adentro del .exe: el cliente no instala nada previo.
      - run: npm run build

      # La app de escritorio (Electron): UcoBot entero más el agente adentro, en un
      # instalador. Mismo código de src/ que el .exe suelto.
      - name: Armar la app de escritorio
        run: npm run build:desktop

      # El .exe se instala solo, así que el ZIP es sólo una comodidad para quien
      # prefiera bajar un paquete con las instrucciones al lado. El archivo que
      # importa es el .exe suelto: doble click y listo.
      - name: Armar el paquete
        run: |
          mkdir package
          copy dist\UcoBotAgent.exe package\
          copy INSTALAR.txt package\
          Compress-Archive -Path package\* -DestinationPath UcoBotAgent-windows.zip

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UcoBotAgent.exe
            UcoBotAgent-windows.zip
            dist-desktop/UcoBot-Setup.exe
          generate_release_notes: true
          # Un tag con guion (v1.2.0-beta.1) es una prueba: se publica como
          # prerelease para que NO pase a ser "la última". El botón de descarga
          # del panel apunta a releases/latest, y sin esto un cliente que instala
          # el agente se llevaba una versión sin probar.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # El APK para los POSNET Android (iMin y compañía). Se compila siempre, aunque
  # no haya tag: es la única forma de saber que el código Android compila, porque
  # se escribe sin un equipo a mano.
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No hay gradle wrapper en el repo (es un .jar binario): la acción instala
      # Gradle y se lo invoca directo.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar firma estable
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Falta ANDROID_KEYSTORE_BASE64" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ucobot-agent-release.p12"

      - name: Compilar el APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/ucobot-agent-release.p12', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk UcoBotAgent-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UcoBotAgent-android
          path: UcoBotAgent-android.apk

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: UcoBotAgent-android.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
